name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python-Syntax
        run: python3 -m py_compile agent/pombot_agent/*.py panel/pombot_panel/*.py panel/pombot_panel/routers/*.py
      - name: Shell-Skripte
        run: for f in install.sh agent/*.sh panel/setup-panel.sh packaging/*.sh; do bash -n "$f"; done
      - name: JavaScript
        run: node --check panel/pombot_panel/static/app.js
      - name: Pakete bauen
        run: bash packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb-pakete
          path: dist/*.deb

  integration:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb-pakete
          path: dist
      - name: Integrationstest (echter LXC-Container, Firewall, Backup)
        run: bash packaging/ci-integration.sh
      - name: Diagnose hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnose
          path: /tmp/diag
          if-no-files-found: ignore
      - name: Logs bei Fehler
        if: failure()
        run: |
          sudo journalctl -u pombot-panel -u pombot-agent --no-pager -n 200 || true
          sudo nft list ruleset || true

  oneclick:
    # One-Click-Installer auf frischem Server (installiert das neueste veröffentlichte Release)
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: get.sh ausführen
        run: sudo bash get.sh
      - name: Panel und Node prüfen
        run: |
          systemctl is-active pombot-panel pombot-agent
          PW="$(sudo sed -n 's/^Admin angelegt: admin \/ //p' /root/pombot-admin.txt)"
          test -n "$PW"
          curl -sk -c jar -H "X-PomBot: 1" -H "Content-Type: application/json"             -d "{\"username\":\"admin\",\"password\":\"$PW\"}" https://127.0.0.1:8443/api/auth/login | grep -q '"ok":true'
          curl -sk -b jar https://127.0.0.1:8443/api/nodes | tee /dev/stderr | grep -q '"status":"online"'
      - name: Zweiter Lauf (Update) darf nichts kaputt machen
        run: |
          sudo bash get.sh
          systemctl is-active pombot-panel pombot-agent

  kvm-matrix:
    # Vergleicht VM-Einstellungen bei verschachtelter Virtualisierung – nur bei manuellem Start
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb-pakete
          path: dist
      - name: VM-Einstellungen bei verschachtelter Virtualisierung vergleichen
        run: bash packaging/ci-kvm-matrix.sh
      - name: Ergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kvm-matrix
          path: /tmp/diag
          if-no-files-found: ignore
